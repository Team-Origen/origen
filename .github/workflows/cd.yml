name: CD Render

# Deploys main to Render after every merge (push) to main.
# Render's own auto-deploy is off (render.yaml), so this is the only trigger.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serializes only the hook requests, which return in seconds. Render queues
# and runs the actual deploys; this group does not wait for them to finish.
concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy a Render
    runs-on: ubuntu-latest
    environment: production
    # This job only calls the deploy hook with its own secret; the GitHub
    # token gets no permissions here.
    permissions: {}
    steps:
      - name: Trigger Render deploy for this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing secret RENDER_DEPLOY_HOOK_URL (Render > origen > Settings > Deploy Hook)."
            exit 1
          fi
          # ref pins the deploy to the exact merged commit. Render hook URLs
          # already carry ?key=..., but pick the separator so any URL works.
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) SEP="&" ;;
            *) SEP="?" ;;
          esac
          curl --fail --silent --show-error --max-time 60 -X POST \
            "${RENDER_DEPLOY_HOOK_URL}${SEP}ref=${COMMIT_SHA}" > /dev/null
          # The hook only queues the deploy: build, migrations and health check
          # results are visible in the Render dashboard, not in this run.
          echo "Deploy queued in Render for ${COMMIT_SHA}."

  # Tags each deployed commit as v<YYYY.MM.DD>-<run number> (UTC), e.g.
  # v2026.11.11-12. The tag means "deploy requested", not "deploy live":
  # check the Render dashboard for the result.
  # Separate job: it alone gets contents: write, never sees the deploy hook
  # secret, and if it fails, "Re-run failed jobs" retries only the tag
  # without calling the deploy hook again.
  tag:
    name: Tag the deployed commit
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the deploy tag unless the commit already has one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Only tags in the deploy format count, so a manual release tag such
          # as v1.0.0 on the same commit does not suppress the deploy tag.
          EXISTING=$(gh api "repos/${REPO}/git/matching-refs/tags/v" --jq "
            [.[] | select(.object.sha == \"${COMMIT_SHA}\")
                 | select(.ref | test(\"^refs/tags/v[0-9]{4}[.][0-9]{2}[.][0-9]{2}-[0-9]+$\"))
                 | .ref] | first // empty")
          if [ -n "$EXISTING" ]; then
            echo "Commit already tagged as ${EXISTING#refs/tags/}; skipping."
            exit 0
          fi
          TAG="v$(date -u +%Y.%m.%d)-${RUN_NUMBER}"
          gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${COMMIT_SHA}" > /dev/null
          echo "Tagged ${COMMIT_SHA} as ${TAG}."
