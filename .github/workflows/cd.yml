name: CD Render

# Deploys main to Render after every merge (push) to main.
# Render's own auto-deploy is off (render.yaml), so this is the only trigger.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serializes only the hook requests, which return in seconds. Render queues
# and runs the actual deploys; this group does not wait for them to finish.
concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy a Render
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy for this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing secret RENDER_DEPLOY_HOOK_URL (Render > origen > Settings > Deploy Hook)."
            exit 1
          fi
          # ref pins the deploy to the exact merged commit. Render hook URLs
          # already carry ?key=..., but pick the separator so any URL works.
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) SEP="&" ;;
            *) SEP="?" ;;
          esac
          curl --fail --silent --show-error --max-time 60 -X POST \
            "${RENDER_DEPLOY_HOOK_URL}${SEP}ref=${COMMIT_SHA}" > /dev/null
          # The hook only queues the deploy: build, migrations and health check
          # results are visible in the Render dashboard, not in this run.
          echo "Deploy queued in Render for ${COMMIT_SHA}."
