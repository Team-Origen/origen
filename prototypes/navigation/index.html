padding:24px;background:var(--background)}.panel p{margin:8px 0 16px}.panel strong{font-size:28px}.panel a{font-weight:600}.stack{display:grid;gap:16px}.appointment{display:flex;align-items:center;gap:24px}.day{min-width:72px;border-right:1px solid var(--border);padding-right:24px;text-align:center}.day strong{display:block;font-size:28px}.appointment .grow{flex:1}.appointment h2{margin-bottom:4px}.appointment p{margin:0}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.route{padding:16px 0;border-top:1px solid var(--border);margin-top:40px;font-size:13px;color:var(--secondary);overflow-wrap:anywhere}.route code{color:var(--primary)}.route p{margin:8px 0}.notice{padding:16px 20px;border-left:4px solid var(--primary);background:var(--accent);border-radius:var(--control);margin:24px 0}.notice p{margin:0}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:var(--background);box-shadow:0 8px 32px #0a384733;border-radius:var(--surface);display:flex;align-items:center;gap:16px;padding:8px;z-index:4;max-width:calc(100% - 24px)}.switcher button{background:transparent;border-color:var(--accent);color:var(--background);padding:8px 14px}.switcher button:focus-visible{outline-color:var(--accent)}.switcher span{min-width:190px;text-align:center;font-size:13px}.switcher small{display:block;color:var(--accent)}#feedback{min-height:24px;margin:16px 0}.field{display:grid;gap:8px;margin-bottom:20px}.field input{border:1px solid var(--border);padding:12px;border-radius:var(--control);color:var(--primary);background:var(--background)}.field input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.subnav{margin-bottom:24px}.subnav a{font-weight:600}.empty{text-align:center;padding:48px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:850px){.header-inner{gap:16px;padding:16px 20px;flex-wrap:wrap}.header nav{order:3;flex-basis:100%}.identity{display:none}.grid{grid-template-columns:1fr}.lab{padding:12px 20px}.title-row{align-items:flex-start;flex-direction:column}.appointment{flex-wrap:wrap}main{padding:0 20px;margin-top:32px}nav a{padding:12px 10px;font-size:14px}.brand small{font-size:11px}.two-row nav{gap:8px}.switcher span{min-width:140px}.switcher{gap:8px}}
</style>
</head>
<body>
<div class="lab"><div><strong>PROTOTIPO · SIN AUTENTICACIÓN</strong><p>Datos ficticios. Ninguna acción modifica el sistema.</p></div><label for="role">Vista de prueba <select id="role"><option value="paciente">Paciente</option><option value="profesional">Profesional</option><option value="secretaria">Secretaría</option><option value="administrador">Administrador</option></select></label></div>
<header class="header"><div class="header-inner"><a class="brand" id="home" href="#"><img id="logo" src="../../priv/static/images/origen-logo-dark.png" alt="" width="56" height="55"><span class="brand-name">Origen<small>Gestión de turnos</small></span></a><nav aria-label="Navegación principal" id="nav"></nav><details class="account" id="account"><summary aria-label="Abrir menú de cuenta"><span class="avatar" id="initials">ML</span><span class="identity"><b id="name">María López</b><small id="role-name">Paciente</small></span><span aria-hidden="true">⌄</span></summary><div class="dropdown"><p id="account-description"></p><button id="logout" type="button">Cerrar sesión</button></div></details></div></header>
